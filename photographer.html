<!DOCTYPE html>
<html lang="fr">
  <head>
    <link href="css/output/style.css" rel="stylesheet" type="text/css" />
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap"
      rel="stylesheet"
    />
    <title>Fisheye - photographe</title>
  </head>
  <body>
    <header class="py-4">
      <a href="index.html">
        <img src="assets/images/logo.png" class="logo" alt="fisheye logo" />
      </a>
    </header>

    <main id="main">
      <div class="profile-loader loading"></div>
      <div class="photograph-header none">
        <div>
          <h1 class="photograph-header__name"></h1>
          <h2 class="photograph-header__localisation"></h2>
          <h2 class="photograph-header__tag"></h2>
        </div>
        <button class="contact_button" id="contact-btn" data-target="contact">
          Contactez-moi
        </button>
        <div class="photograph-header__container">
          <img src="" alt="" class="photograph-header__picture" />
        </div>
      </div>
      <div class="custom-select-context row mt-1">
        <span
          class="custom-select-context__title"
          id="select-label"
          tabindex="0"
          >Trier par</span
        >
        <div class="custom-select">
          <span
            aria-labelledby="select-label"
            class="active-option"
            tabindex="0"
            data-value="popularity"
            role="button"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span>Popularité</span>
            <img src="/assets/icons/arrow.svg" alt="flèche" />
          </span>
          <ul
            class="options"
            id="select-input"
            role="listbox"
            aria-activedescendant="option-1"
          >
            <li
              tabindex="0"
              id="option-1"
              role="option"
              aria-selected="true"
              class="option"
              data-label="Popularité"
              data-selected="true"
              data-value="popularity"
            >
              Popularité
            </li>
            <li
              tabindex="0"
              id="option-2"
              role="option"
              aria-selected="false"
              class="option"
              data-label="Date"
              data-selected="false"
              data-value="date"
            >
              Date
            </li>
            <li
              tabindex="0"
              id="option-3"
              role="option"
              aria-selected="false"
              class="option"
              data-label="Titre"
              data-selected="false"
              data-value="title"
            >
              Titre
            </li>
          </ul>
        </div>
      </div>
      <div class="loader loading"></div>
      <div id="card-container" class="mt-2"></div>
    </main>

    <div
      class="hoverable-container"
      tabindex="0"
      aria-label="Statistiques likes et prix"
    >
      <div class="likes-pricing flex justify-between align-center">
        <p class="m-0">
          <span class="total-likes">2344 </span>
          <img src="./assets/icons/heart-black.svg" alt="coeur" />
        </p>
        <span class="pricing">300/jour</span>
      </div>
    </div>
    <div
      id="modal-container"
      role="dialog"
      aria-modal="true"
      aria-labelledby="contact-modal-title"
    >
      <div tabindex="-1" class="modal contact-container none">
        <header>
          <h1 id="contact-modal-title">
            Contactez-moi <br />
            <span class="photograph-header__name"></span>
          </h1>
          <button
            type="button"
            aria-label="Fermer la modale"
            class="pointer close-modal-btn"
          >
            <img src="assets/icons/close.svg" alt="icône croix" />
          </button>
        </header>
        <form id="contact-form">
          <div>
            <label for="firstname">Prénom</label>
            <input required type="text" name="firstname" id="firstname" />
          </div>
          <div>
            <label for="lastname">Nom</label>
            <input required type="text" name="lastname" id="lastname" />
          </div>
          <div>
            <label for="email">Email</label>
            <input required type="email" name="email" id="email" />
          </div>
          <div>
            <label for="message">Votre message</label>
            <textarea required name="message" id="message" rows="5"></textarea>
          </div>
          <button type="submit" class="contact_button submit-btn">
            Envoyer
          </button>
        </form>
      </div>
      <div tabindex="-1" id="carrousel" class="none">
        <button
          class="icon-btn pointer"
          id="prev-chevron"
          aria-label="passer à l'image précédente"
        >
          <img
            src="./assets/icons/chevron-left.svg"
            alt="chevron: image précédente"
          />
        </button>
        <figure class="image-container">
          <video controls class="none">
            <source src="" type="" />
          </video>
          <img src="" alt="" />
          <figcaption></figcaption>
        </figure>
        <div class="flex column-reverse justify-center h-10">
          <button
            tabindex="0"
            class="icon-btn m-b-auto pointer"
            id="next-chevron"
            aria-label="passer à l'image suivante"
          >
            <img
              src="./assets/icons/chevron-right.svg"
              alt="chevron: image suivante"
            />
          </button>
          <button
            class="icon-btn close-carrousel-btn m-b-auto pointer close-modal-btn"
            aria-label="fermer le carrousel"
          >
            <img
              src="./assets/icons/close-primary.svg"
              alt="croix: fermer la modale"
            />
          </button>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="/scripts/pages/photographer.js"
      loading="lazy"
    ></script>
  </body>
</html>
