<!DOCTYPE html>
<html>
  <head>
    <link href="css/output/style.css" rel="stylesheet" type="text/css" />
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap"
      rel="stylesheet"
    />
    <title>Fisheye - photographe</title>
  </head>
  <body>
    <header>
      <a href="index.html">
        <img src="assets/images/logo.png" class="logo" alt="fisheye logo" />
      </a>
    </header>

    <main id="main">
      <div class="photograph-header">
        <div>
          <h1 class="photograph-header__name"></h1>
          <p class="photograph-header__localisation"></p>
          <p class="photograph-header__tag"></p>
        </div>
        <button class="contact_button" onclick="displayModal('contact')">
          Contactez-moi
        </button>
        <div class="photograph-header__container">
          <img src="" alt="" class="photograph-header__picture" />
        </div>
      </div>
      <div class="custom-select-context row mt-1">
        <label id="select-label" tabindex="0">Trier par</label>
        <div class="custom-select">
          <span
            class="active-option"
            tabindex="0"
            data-value="popularity"
            role="button"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span>Popularité</span>
            <img src="/assets/icons/arrow.svg" alt="flèche"
          /></span>
          <ul
            class="options"
            id="select-input"
            role="listbox"
            aria-labelledby="select-label"
            aria-activedescendant="option-1"
          >
            <li
              tabindex="0"
              id="option-1"
              role="option"
              aria-selected="true"
              class="option"
              data-label="Popularité"
              data-selected="true"
              data-value="popularity"
            >
              Popularité
            </li>
            <li
              tabindex="0"
              id="option-2"
              role="option"
              aria-selected="false"
              class="option"
              data-label="Date"
              data-selected="false"
              data-value="date"
            >
              Date
            </li>
            <li
              tabindex="0"
              id="option-3"
              role="option"
              aria-selected="false"
              class="option"
              data-label="Titre"
              data-selected="false"
              data-value="title"
            >
              Titre
            </li>
          </ul>
        </div>
      </div>
      <div id="card-container" class="mt-2"></div>
    </main>
    <div
      id="modal-container"
      role="dialog"
      aria-modal="true"
      aria-labelledby="contact-modal-title"
    >
      <div tabindex="-1" class="modal contact-container none">
        <header>
          <h1 id="contact-modal-title">
            Contactez-moi <br />
            <span class="photograph-header__name"></span>
          </h1>
          <button
            type="button"
            onclick="closeModal()"
            aria-label="Fermer la modale"
          >
            <img src="assets/icons/close.svg" />
          </button>
        </header>
        <form id="contact-form">
          <div>
            <label for="firstname">Prénom</label>
            <input required type="text" name="firstname" id="firstname" />
          </div>
          <div>
            <label for="lastname">Nom</label>
            <input required type="text" name="lastname" id="lastname" />
          </div>
          <div>
            <label for="email">Email</label>
            <input required type="email" name="email" id="email" />
          </div>
          <div>
            <label for="message">Votre message</label>
            <textarea required name="message" id="message" rows="5"></textarea>
          </div>
          <button type="submit" class="contact_button submit-btn">
            Envoyer
          </button>
        </form>
      </div>
      <div tabindex="-1" id="carrousel" class="none">
        <button class="icon-btn" id="prev-chevron">
          <img
            src="./assets/icons/chevron-left.svg"
            alt="chevron: image précédente"
          />
        </button>
        <figure class="image-container">
          <video controls class="none">
            <source src="" type="" />
          </video>
          <img src="" alt="" />
          <figcaption></figcaption>
        </figure>
        <div class="flex column justify-center h-10">
          <button
            class="icon-btn close-carrousel-btn m-b-auto"
            onclick="closeModal()"
          >
            <img
              src="./assets/icons/close-primary.svg"
              alt="croix: fermer la modale"
            />
          </button>
          <button class="icon-btn m-b-auto" id="next-chevron">
            <img
              src="./assets/icons/chevron-right.svg"
              alt="chevron: image suivante"
            />
          </button>
        </div>
      </div>
    </div>
    <script src="/scripts/pages/photographer.js" loading="lazy"></script>
    <script src="/scripts/utils/contactForm.js" loading="lazy"></script>
    <script src="/scripts/utils/select.js" loading="lazy"></script>
    <script src="/scripts/utils/carrousel.js" loading="lazy"></script>
  </body>
</html>
